name: Daily website health check

on:
  schedule:
    # 8:00 AM Eastern during EDT (UTC-4). In EST this is 7:00 AM.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run health checks
        run: python health_check.py
        continue-on-error: true

      - name: Publish data.json for GHL
        run: |
          cp dashboard/data.json data.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json dashboard/data.json
          if git diff --staged --quiet; then
            echo "No changes to publish"
          else
            git commit -m "chore: daily health status $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Purge jsDelivr cache
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/cris1990x/website-health-status@main/data.json" || true
